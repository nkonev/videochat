# This file used for both developer and demo purposes.
# It contains environment
services:
  traefik:
    image: traefik:v3.7.13
    hostname: traefik
    restart: unless-stopped
    environment:
      - OTEL_PROPAGATORS=jaeger
    # The Static Configuration
    command: --configFile=/etc/traefik/traefik.yml
    ports:
      - 0.0.0.0:8081:8081
    extra_hosts:
      # https://github.com/moby/moby/pull/40007
      # works on Docker for Mac 3.4.0 or Linux Docker 20.10.4
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z
      - ./docker/traefik:/etc/traefik:z
    logging:
      # https://docs.docker.com/engine/logging/drivers/fluentd/
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true" # in order not to fail in case traefik started faster than fluent-bit
        tag: videochat.infra.traefik
        fluentd-sub-second-precision: "true"
    networks:
      backend:


  postgresql:
    image: postgres:17.0-alpine3.20
    hostname: postgresql
    restart: unless-stopped
    ports:
      - 35432:5432
    volumes:
      - ./docker/postgresql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:z
      - postgres_data:/var/lib/postgresql/data:z
    environment:
      - POSTGRES_PASSWORD=postgresqlPassword
    networks:
      backend:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"

  postgresql-citus-coordinator-1:
    image: citusdata/citus:14.0.0-alpine
    hostname: postgresql-citus-coordinator-1
    container_name: postgresql-citus-coordinator-1
    restart: unless-stopped
    ports:
      - 45401:5432
    volumes:
      - ./docker/postgresql-citus/common/docker-entrypoint-initdb.d/002-common-init.sql:/docker-entrypoint-initdb.d/002-common-init.sql:z
      - ./docker/postgresql-citus/coordinator/docker-entrypoint-initdb.d/003-coordinator-init.sh:/docker-entrypoint-initdb.d/003-coordinator-init.sh:z
      - ./scripts/wait-for-it.sh:/sbin/wait-for-it.sh:z
      - postgres_chat_citus_coordinator_1_data:/var/lib/postgresql/18/docker:z
    environment:
      - POSTGRES_PASSWORD=postgresqlPassword
    networks:
      backend:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
  postgresql-citus-worker-1:
    image: citusdata/citus:14.0.0-alpine
    hostname: postgresql-citus-worker-1
    container_name: postgresql-citus-worker-1
    restart: unless-stopped
    ports:
      - 45501:5432
    volumes:
      - ./docker/postgresql-citus/common/docker-entrypoint-initdb.d/002-common-init.sql:/docker-entrypoint-initdb.d/002-common-init.sql:z
      - postgres_chat_citus_worker_1_data:/var/lib/postgresql/18/docker:z
    environment:
      - POSTGRES_PASSWORD=postgresqlPassword
    networks:
      backend:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
  postgresql-citus-worker-2:
    image: citusdata/citus:14.0.0-alpine
    hostname: postgresql-citus-worker-2
    container_name: postgresql-citus-worker-2
    restart: unless-stopped
    ports:
      - 45502:5432
    volumes:
      - ./docker/postgresql-citus/common/docker-entrypoint-initdb.d/002-common-init.sql:/docker-entrypoint-initdb.d/002-common-init.sql:z
      - postgres_chat_citus_worker_2_data:/var/lib/postgresql/18/docker:z
    environment:
      - POSTGRES_PASSWORD=postgresqlPassword
    networks:
      backend:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"

  kafka:
    image: apache/kafka:4.3.1
    # image: huecker.io/apache/kafka:3.7.0
    restart: unless-stopped
    hostname: kafka
    ports:
      - "39092:39092"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,PLAINTEXT_HOST://127.0.0.1:39092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'INTERNAL://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      backend:

    volumes:
      # https://github.com/apache/kafka/blob/4.2.0/docker/jvm/Dockerfile#L108
      - kafka_data:/var/lib/kafka/data:z

  redis:
    image: valkey/valkey:8.1.0-alpine3.21
    hostname: redis
    restart: unless-stopped
    ports:
      - 36379:6379
    volumes:
      - redis_data_dir:/data:z
    networks:
      backend:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"

  rustfs:
    image: rustfs/rustfs:1.0.1
    hostname: rustfs
    restart: unless-stopped
    ports:
      - 39000:9000
      - 39001:9001
    networks:
      backend:
    environment:
      - RUSTFS_ACCESS_KEY=AKIAIOSFODNN7EXAMPLE
      - RUSTFS_SECRET_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      # https://github.com/rustfs/rustfs/issues/1784
      # ...
      # https://github.com/rustfs/rustfs/pull/2873/changes
      # https://github.com/rustfs/rustfs/pull/2879/changes
      - RUSTFS_NOTIFY_ENABLE=true
      - RUSTFS_NOTIFY_AMQP_ENABLE_PRIMARY=true
      - RUSTFS_NOTIFY_AMQP_URL_PRIMARY=amqp://videoChat:videoChatPazZw0rd@rabbitmq:5672
      - RUSTFS_NOTIFY_AMQP_EXCHANGE_PRIMARY=rustfs-events
      # - RUSTFS_NOTIFY_AMQP_EXCHANGE_TYPE_PRIMARY=direct
      - RUSTFS_NOTIFY_AMQP_MANDATORY_PRIMARY=false
      - RUSTFS_NOTIFY_AMQP_PERSISTENT_PRIMARY=true
      # - RUSTFS_NOTIFY_AMQP_NO_WAIT_PRIMARY=off
      # - RUSTFS_NOTIFY_AMQP_AUTO_DELETED_PRIMARY=off
      # - RUSTFS_NOTIFY_AMQP_DELIVERY_MODE_PRIMARY=2
    volumes:
      - rustfs_data:/data:z
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - 35672:15672
      - 36672:5672
    environment:
      - RABBITMQ_DEFAULT_USER=videoChat
      - RABBITMQ_DEFAULT_PASS=videoChatPazZw0rd
    volumes:
      - rabbitmq_data_dir:/var/lib/rabbitmq:z
      - ./docker/rabbitmq/additional.conf:/etc/rabbitmq/conf.d/additional.conf:ro,z
    networks:
      backend:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml

  egress:
    image: livekit/egress:v1.14.1
    restart: unless-stopped
    networks:
      backend:
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/egress/config.yaml:/etc/egress/config.yaml
      - egress_tmp:/home/egress/tmp:z
    cap_add:
      - SYS_ADMIN

  pgadmin:
    restart: unless-stopped
    hostname: pgadmin
    image: dcagatay/pwless-pgadmin4:8.13
    environment:
      - POSTGRES_USER_1=postgres
      - POSTGRES_PASSWORD_1=postgresqlPassword
      - POSTGRES_HOST_1=postgresql
      - POSTGRES_PORT_1=5432
      - POSTGRES_USER_2=postgres
      - POSTGRES_PASSWORD_2=postgresqlPassword
      - POSTGRES_HOST_2=postgresql-citus-coordinator-1
      - POSTGRES_PORT_2=5432
      - PGADMIN_DISABLE_POSTFIX=1
      - PGADMIN_LISTEN_ADDRESS=0.0.0.0
      - PGADMIN_LISTEN_PORT=8080
      - SCRIPT_NAME=/postgresql
    networks:
      backend:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"

  fluentbit:
    image: fluent/fluent-bit:4.0.4
    restart: unless-stopped
    hostname: fluentbit
    volumes:
      - ./docker/fluent-bit/etc:/fluent-bit/etc:z
      - ./aaa/log:/var/log/videochat/aaa/log:z
      - ./chat/log:/var/log/videochat/chat/log:z
      - ./storage/log:/var/log/videochat/storage/log:z
      - ./video/log:/var/log/videochat/video/log:z
      - ./event/log:/var/log/videochat/event/log:z
      - ./notification/log:/var/log/videochat/notification/log:z
      - ./public/log:/var/log/videochat/public/log:z
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    networks:
      backend:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"

  kafka-ui:
    image: docker.redpanda.com/redpandadata/console:v2.8.13
    hostname: kafka-ui
    restart: unless-stopped
    ports:
      - "38080:8080"
    networks:
      backend:
    command:
      - "-config.filepath"
      - "/app/kafka-ui.yml"
    volumes:
      - ./docker/kafka-ui/kafka-ui.yml:/app/kafka-ui.yml:z
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"

  victoria-logs:
    image: docker.io/victoriametrics/victoria-logs:v1.50.0
    restart: unless-stopped
    hostname: victoria-logs
    ports:
      - 39428:9428
    networks:
      backend:
    command:
      - "-http.pathPrefix"
      - "/logs"
      - "-retentionPeriod"
      - "14d"
    volumes:
      - victoria_logs_data:/victoria-logs-data:z
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"

  victoria-traces:
    image: docker.io/victoriametrics/victoria-traces:v0.12.0
    restart: unless-stopped
    hostname: victoria-traces
    ports:
      - 30428:10428
      - 34317:4317
    networks:
      backend:
    command:
      - "-http.pathPrefix=/traces"
      - "-retentionPeriod=14d"
      - "-otlpGRPC.tls=false"
      - "-otlpGRPCListenAddr=:4317"
    volumes:
      - victoria_traces_data:/victoria-traces-data:z
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"

volumes:
  postgres_data:
  postgres_chat_citus_coordinator_1_data:
  postgres_chat_citus_worker_1_data:
  postgres_chat_citus_worker_2_data:
  redis_data_dir:
  rustfs_data:
  rabbitmq_data_dir:
  egress_tmp:
  kafka_data:
  victoria_logs_data:
  victoria_traces_data:

networks:
  backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
